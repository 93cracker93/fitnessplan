<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fitnessplan</title>
<style>
  body {
    background-color: #121212;
    color: #e0e0e0;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 1rem;
  }
  .header-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  h1 {
    margin: 0;
    color: #f5a623;
    font-size: 1.6rem;
  }
  #reset-storage-button {
    background-color: #f5a623;
    color: #121212;
    border: none;
    border-radius: 4px;
    padding: 0.25rem 0.75rem;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background-color 0.3s;
  }
  #reset-storage-button:hover,
  #reset-storage-button:focus {
    background-color: #e09e1f;
    outline: none;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 2rem;
    table-layout: fixed;
  }
  thead {
    background-color: #1e1e1e;
  }
  th, td {
    padding: 0.4rem 0.5rem;
    text-align: left;
    vertical-align: middle;
    overflow: hidden;
    white-space: normal;
    word-wrap: break-word;
    text-overflow: ellipsis;
  }
  th {
    border-bottom: 2px solid #f5a623;
    font-weight: 600;
  }
  tbody tr:nth-child(odd) {
    background-color: #222;
    color: #e0e0e0;
  }
  tbody tr:nth-child(even) {
    background-color: #1c1c1c;
    color: #e0e0e0;
  }
  th:nth-child(1), td:nth-child(1) { width: 25%; }
  th:nth-child(2), td:nth-child(2) { width: 14%; }
  th:nth-child(3), td:nth-child(3) { width: 14%; }
  th:nth-child(4), td:nth-child(4) { width: 15%; }
  th:nth-child(5), td:nth-child(5) { width: 12%; text-align: center; }

  @media (max-width: 600px) {
    body { padding: 0.5rem; font-size: 0.9rem; }
    .header-container { flex-direction: column; gap: 0.5rem; }
    h1 { font-size: 1.3rem; }
    #reset-storage-button { width: 100%; font-size: 1rem; }
    table { font-size: 0.75rem; width: 100%; border-spacing: 0; table-layout: auto; }
  }

  .clicked { background-color: #444 !important; color: #f5a623 !important; }
  tbody tr.clicked { color: #f5a623 !important; }
  tbody tr.note-row { display: none; }
  tbody tr.note-row.active { display: table-row; }

  .toggle-notes-button {
    font-size: 0.85rem;
    padding: 0.15rem 0.3rem;
    width: 1.3em;
    height: 1.3em;
    line-height: 1;
    border-radius: 3px;
    background-color: #f5a623;
    color: #121212;
    font-weight: bold;
    border: none;
    cursor: pointer;
    user-select: none;
    text-align: center;
    transition: background-color 0.3s;
  }
  .toggle-notes-button:hover,
  .toggle-notes-button:focus {
    background-color: #e09e1f;
    outline: none;
  }
  .notes-edit-textarea {
    width: 100%;
    box-sizing: border-box;
    border-radius: 4px;
    border: 1px solid #f5a623;
    background-color: #1a1a1a !important;
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.3rem 0.5rem;
    resize: vertical;
    color: inherit;
    transition: background-color 0.3s;
  }
  .notes-edit-textarea:focus {
    background-color: #333333 !important;
    outline: none;
  }
</style>
</head>
<body>
<div class="header-container">
  <h1>Mein Fitnessplan</h1>
  <button id="reset-storage-button" title="Alle gespeicherten Daten zurücksetzen">Zurücksetzen</button>
</div>
<table>
  <thead>
    <tr>
      <th>Übung</th>
      <th>Gerät</th>
      <th>Wdh.</th>
      <th>kg</th>
      <th>Notizen</th>
    </tr>
  </thead>
  <tbody id="table-body"></tbody>
</table>

<script>
window.addEventListener("DOMContentLoaded", () => {
  function safeParseJSON(key, fallback) {
    try {
      const item = localStorage.getItem(key);
      if (!item) return fallback;
      return JSON.parse(item);
    } catch {
      return fallback;
    }
  }

  const exercises = [
    { name: "Beinpresse", device: "30", wdh: "1", kg: "70", notes: "Lehne ganz nach hinten, Füße schulterbreit in der Mitte der Auflage platzieren, Fußspitzen zeigen leicht nach außen" },
    { name: "Adduktor", device: "25", wdh: "2", kg: "55", notes: "Außen auf 3 setzen" },
    { name: "Abduktor", device: "24", wdh: "2", kg: "55", notes: "Auf 1 setzen" },
    { name: "Latzug", device: "48/41", wdh: "1", kg: "50", notes: "Schultern mit herunternehmen, Ellenbogen leicht vor dem Körper halten, Zug zur Hüfte" },
    { name: "Rudern", device: "4/41", wdh: "1", kg: "40", notes: "Ellenbogen eng am Körper, Zug zur Hüfte" },
    { name: "Brustpresse", device: "63", wdh: "1", kg: "35", notes: "Schultern unten lassen, Sitz zwischen 6–7" },
    { name: "Butterfly", device: "52", wdh: "1", kg: "35", notes: "Griffe auf Brusthöhe, Schultern unten lassen, Sitz 6" },
    { name: "Seitheben", device: "66", wdh: "1", kg: "25", notes: "Drehgelenk auf Schulterhöhe, Bewegung aus dem Ellenbogen" },
    { name: "Butterfly reverse", device: "51", wdh: "1", kg: "30", notes: "Rücken gerade, Schultern unten lassen" },
    { name: "Rückenstrecker", device: "43", wdh: "1", kg: "40", notes: "Rückenrolle Stufe 4, Beine zwischen 5 und 6" },
    { name: "Bauch", device: "77", wdh: "1", kg: "10", notes: "Schulter auf Höhe der Armstützen" }
  ];

  let clickedRows = safeParseJSON("clickedRows", []);
  let expandedNotes = safeParseJSON("expandedNotes", []);
  let wdhValues = safeParseJSON("wdhValues", {});
  let kgValues = safeParseJSON("kgValues", {});
  let notesTexts = safeParseJSON("notesTexts", {});

  expandedNotes = expandedNotes.filter((i) => i >= 0 && i < exercises.length);

  const tbody = document.getElementById("table-body");
  tbody.innerHTML = "";

  function createCell(content, className, rowIndex) {
    const td = document.createElement("td");
    if (className) td.className = className;
    if (rowIndex !== undefined) td.setAttribute("data-row-index", rowIndex);
    td.textContent = content;
    return td;
  }

  function updateStorage() {
    localStorage.setItem("expandedNotes", JSON.stringify(expandedNotes));
  }

  exercises.forEach((ex, i) => {
    const trMain = document.createElement("tr");
    trMain.classList.add("main-row");
    if (clickedRows.includes(i)) trMain.classList.add("clicked");

    function getRowTextColor() {
      if (trMain.classList.contains("clicked")) return "#f5a623";
      return "#e0e0e0";
    }

    const tdName = createCell(ex.name, "", i);
    const tdDevice = createCell(ex.device);
    const wdhVal = wdhValues[i] || ex.wdh;
    const tdWdh = createCell(wdhVal, "wdh-cell", i);
    const kgVal = kgValues[i] || ex.kg;
    const tdKg = createCell(kgVal, "kg-cell", i);

    const tdNotesBtn = document.createElement("td");
    const noteText = notesTexts[i]?.trim() || ex.notes.trim();
    const toggleButton = document.createElement("button");
    toggleButton.className = "toggle-notes-button";
    toggleButton.textContent = expandedNotes.includes(i) ? "−" : "+";
    tdNotesBtn.appendChild(toggleButton);

    const trNote = document.createElement("tr");
    trNote.classList.add("note-row");
    if (expandedNotes.includes(i)) trNote.classList.add("active");
    const tdNote = document.createElement("td");
    tdNote.colSpan = 5;
    tdNote.textContent = noteText;
    trNote.appendChild(tdNote);

    toggleButton.addEventListener("click", (e) => {
      e.stopPropagation();
      const active = trNote.classList.toggle("active");
      toggleButton.textContent = active ? "−" : "+";
      if (active) expandedNotes.push(i);
      else expandedNotes = expandedNotes.filter((x) => x !== i);
      updateStorage();
    });

    tdWdh.addEventListener("click", (e) => {
      if (tdWdh.querySelector("input")) return;
      const input = document.createElement("input");
      input.type = "number";
      input.min = 1;
      input.max = 9;
      input.value = wdhVal;
      input.style.width = "2.5em";
      input.style.background = "transparent";
      input.style.border = "none";
      tdWdh.textContent = "";
      tdWdh.appendChild(input);
      input.focus();
      input.addEventListener("blur", () => {
        let val = input.value.trim();
        if (!/^[1-9]$/.test(val)) val = "1";
        wdhValues[i] = val;
        localStorage.setItem("wdhValues", JSON.stringify(wdhValues));
        tdWdh.textContent = val;
      });
      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") input.blur();
        if (ev.key === "Escape") tdWdh.textContent = wdhVal;
      });
    });

    tdKg.addEventListener("click", (e) => {
      if (tdKg.querySelector("input")) return;
      const input = document.createElement("input");
      input.type = "number";
      input.min = 10;
      input.max = 999;
      input.value = kgVal;
      input.style.width = "3em";
      input.style.background = "transparent";
      input.style.border = "none";
      tdKg.textContent = "";
      tdKg.appendChild(input);
      input.focus();
      input.addEventListener("blur", () => {
        let val = input.value.trim();
        if (!/^[0-9]{2,3}$/.test(val) || val < 10 || val > 999) val = ex.kg;
        kgValues[i] = val;
        localStorage.setItem("kgValues", JSON.stringify(kgValues));
        tdKg.textContent = val;
      });
      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") input.blur();
        if (ev.key === "Escape") tdKg.textContent = kgVal;
      });
    });

    trMain.appendChild(tdName);
    trMain.appendChild(tdDevice);
    trMain.appendChild(tdWdh);
    trMain.appendChild(tdKg);
    trMain.appendChild(tdNotesBtn);
    tbody.appendChild(trMain);
    tbody.appendChild(trNote);
  });

  document.getElementById("reset-storage-button").addEventListener("click", () => {
    if (confirm("Sind Sie sicher, dass Sie alle gespeicherten Daten wirklich zurücksetzen möchten?")) {
      localStorage.clear();
      location.reload();
    }
  });
});
</script>
</body>
</html>
